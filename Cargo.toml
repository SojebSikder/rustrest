[workspace]
members = [
    "rustrest",
    "crates/rustrest-core",
    "crates/rustrest-terminal",
    "crates/rustrest-ssh",
    "crates/rustrest-remote-protocol",
    "crates/rustrest-remote-agent",
    "crates/rustrest-remote",
    "crates/rustrest-command-palette",
    "crates/rustrest-plugin-api",
    "crates/rustrest-plugin-host",
    "crates/rustrest-ws",
    "crates/rustrest-sse",
    "crates/rustrest-graphql",
    "crates/rustrest-grpc",
]
default-members = ["rustrest"]
resolver = "2"

[workspace.package]
# bump this to release a new version; rustrest and rustrest-remote-agent
# inherit it so cargo-dist always builds/publishes both together (dist
# only builds packages whose version matches the release tag)
version = "0.1.18"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

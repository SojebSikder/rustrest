[package]
name = "rustrest-grpc"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustrest_grpc"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.12", default-features = false, features = ["transport", "tls-webpki-roots", "codegen"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
serde_json = "1.0.150"
http = "1"
bytes = "1"

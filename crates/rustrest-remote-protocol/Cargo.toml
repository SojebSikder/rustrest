[package]
name = "rustrest-remote-protocol"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustrest_remote_protocol"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "1.3", features = [] }
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }

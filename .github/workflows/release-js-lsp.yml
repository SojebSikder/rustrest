# Releases the standalone rustrest-js-lsp language server (crates/rustrest-js-lsp,
# not part of the app's cargo-dist workspace). Push a tag like
# `rustrest-js-lsp-v0.1.0` matching its Cargo.toml version. Asset names match
# what the js-lsp plugin downloads:
#   rustrest-js-lsp-<target>.zip | .tar.xz, plus <archive>.sha256
name: Release rustrest-js-lsp

permissions:
  contents: write

on:
  push:
    tags:
      - 'rustrest-js-lsp-v[0-9]+.[0-9]+.[0-9]+*'

env:
  CRATE_DIR: crates/rustrest-js-lsp
  BIN: rustrest-js-lsp

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$CRATE_DIR/Cargo.toml" | head -1)
          if [ "${GITHUB_REF_NAME}" != "${BIN}-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${BIN} version ${version}" >&2
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Test
        shell: bash
        run: cargo test --manifest-path "$CRATE_DIR/Cargo.toml" --locked

      - name: Build
        shell: bash
        run: cargo build --manifest-path "$CRATE_DIR/Cargo.toml" --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="${BIN}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$CRATE_DIR/README.md" "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "../$CRATE_DIR/target/${{ matrix.target }}/release/${BIN}.exe" "$name/"
            archive="$name.zip"
            (cd "$name" && 7z a "../$archive" .)
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "../$CRATE_DIR/target/${{ matrix.target }}/release/${BIN}" "$name/"
            archive="$name.tar.xz"
            tar -cJf "$archive" "$name"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "rustrest-js-lsp language server, used by the js-lsp plugin for script editor completions, hover and diagnostics."
